# @tranp.meta: {"version":"0.9.19","module":{"hash":"610264c440c690a1c7025220e8eab922","path":"script.mfs.mfs_02_math"},"transpiler":{"version":"0.9.6","module":"tranp.app.implements.cpp.transpiler.py2cpp.Py2Cpp"}}
math_resolution_to_aspect:
  name: math_resolution_to_aspect
  desc: '解像度からアスペクト比を算出'
  params:
    - var: [resolution, param: [float2, resolution, float2: [250.0, 250.0], '解像度 (default = 250:250)']]
  statements:
    - returns: [result, div: [mask: [resolution, y], mask: [resolution, x]], 'アスペクト比']
math_resolution_to_pixel_size:
  name: math_resolution_to_pixel_size
  desc: '解像度からピクセルサイズを算出'
  params:
    - var: [resolution, param: [float2, resolution, float2: [250.0, 250.0], '解像度 (default = 250:250)']]
  statements:
    - returns: [result, div: [1.0, min: [mask: [resolution, x], mask: [resolution, y]]], 'ピクセルサイズ']
math_aspect2d:
  name: math_aspect2d
  desc: 'アスペクト比(2次元)を生成'
  params:
    - var: [aspect, param: [float, aspect, 1.0, 'アスペクト比']]
  statements:
    - returns: [result, make_float2: [min: [1.0, aspect], min: [1.0, div: [1.0, aspect]]], 'アスペクト比(2次元)']
math_atan2_clock:
  name: math_atan2_clock
  desc: 'Arctangent2Fast。0時を始点に時計周りに1周の割合(0 ~ 1)を返す'
  params:
    - var: [y, param: [float, y, 0.0, 'Y座標']]
    - var: [x, param: [float, x, preview_alpha: [1.0], 'X座標']]
  statements:
    - returns: [result, add: [div: [proxy_atan2_fast: [mul: [x, -1.0], y], mul: [2.0, pi: []]], 0.5], '1周の割合 (0 ~ 1)']
math_calc_location:
  name: math_calc_location
  desc: '0時を始点に角度と長さを基に座標を算出'
  params:
    - var: [u_theta, param: [float, u_theta, preview_distance: [], '1周の割合 (0 ~ 1)']]
    - var: [length, param: [float, length, 1.0, '長さ (default = 1.0)']]
  statements:
    - returns: [result, mul: [make_float2: [sin: [u_theta], mul: [cos: [u_theta], -1.0]], length], '座標']
math_101:
  name: math_101
  desc: '単位の中央値を境に反転した値を返す (1 ~ 0 ~ 1)'
  params:
    - var: [value, param: [float, value, preview_distance: [], '値']]
    - var: [unit, param: [float, unit, 1.0, '単位 (default = 1.0)']]
  statements:
    - var: [half, mul: [unit, 0.5]]
    - returns: [result, abs: [div: [sub: [value, half], half]], '1 ~ 0 ~ 1']
math_101_flex:
  name: math_101_flex
  desc: '指定の中央値を境に反転した値を返す (1 ~ 0 ~ 1)'
  params:
    - var: [value, param: [float, value, preview_distance: [], '値']]
    - var: [unit, param: [float, unit, 1.0, '単位 (default = 1.0)']]
    - var: [center, param: [float, center, 0.5, '中央値 (default = 0.5)']]
  statements:
    - var: [remain, sub: [unit, center]]
    - var: [abs_value, abs: [sub: [value, center]]]
    - var: [sign, op_le: [value, center]]
    - var: [left, mul: [div: [abs_value, max: [0.0001, center]], sign]]
    - var: [right, mul: [div: [abs_value, max: [0.0001, remain]], op_not: [sign]]]
    - returns: [result, add: [left, right], '1 ~ 0 ~ 1']
math_010:
  name: math_010
  desc: '単位の中央値を境に反転した値を返す (0 ~ 1 ~ 0)'
  params:
    - var: [value, param: [float, value, preview_distance: [], '値']]
    - var: [unit, param: [float, unit, 1.0, '単位 (default = 1.0)']]
  statements:
    - returns: [result, one_minus: [math_101: [value, unit]], '0 ~ 1 ~ 0']
math_linear_edge:
  name: math_linear_edge
  desc: '範囲の先端と終端から閾値の範囲内に値が存在する場合、0 ~ 1まで線形補完で返す'
  params:
    - var: [value, param: [float, value, preview_distance: [], '値']]
    - var: [maximum, param: [float, maximum, 1.0, '範囲']]
    - var: [threshold, param: [float, threshold, 0.1, '閾値']]
  statements:
    - var: [half, mul: [maximum, 0.5]]
    - var: [half_section, abs: [sub: [mod: [value, maximum], half]]]
    - var: [diff, sub: [half_section, sub: [half, threshold]]]
    - returns: [result, div: [saturate: [diff], threshold], '0 ~ 1']
math_vector_to_edge:
  name: math_vector_to_edge
  desc: 'ベクトルから角方向に変換'
  params:
    - var: [vector, param: [float2, vector, preview_vector: [], 'ベクトル']]
  statements:
    - var: [minus_x, op_lt: [mask: [vector, x], 0.0]]
    - var: [minus_y, op_lt: [mask: [vector, y], 0.0]]
    - var: [plus_x, op_not: [minus_x]]
    - var: [plus_y, op_not: [minus_y]]
    - var: [lt, mul: [minus_x, minus_y]]
    - var: [rt, mul: [mul: [plus_x, minus_y], 2.0]]
    - var: [lb, mul: [mul: [minus_x, plus_y], 3.0]]
    - var: [rb, mul: [mul: [plus_x, plus_y], 4.0]]
    - returns: [result, add: [add: [add: [lt, rt], lb], rb], '方向(1=左上, 2=右上, 3=左下, 4=右下)']
