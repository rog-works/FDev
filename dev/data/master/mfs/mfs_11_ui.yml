# @tranp.meta: {"version":"0.9.24","module":{"hash":"500b8195885262072c65165b16ba19fb","path":"script.mfs.mfs_11_ui"},"transpiler":{"version":"0.9.11","module":"tranp.app.implements.cpp.transpiler.py2cpp.Py2Cpp"}}
ui_layer_00:
  name: ui_layer_00
  desc: 'UI用レイヤー'
  params:
    - var: [uv, param: [float2, uv, tex_coord: [0], 'UV座標']]
    - var: [resolution, param: [float2, resolution, float2: [250.0, 250.0], '解像度 (default = 250:250)']]
    - var: [dpi_scale, param: [float, dpi_scale, 0.6666, 'DPIスケール (default = 0.666)']]
  statements:
    - exports_00: []
    # 解像度
    - var: [aspect, math_resolution_to_aspect: [resolution]]
    - var: [pixel_size, math_resolution_to_pixel_size: [resolution]]
    # UV座標
    - var: [uv_base_0, ternary: [make_float2: [one_minus: [mask: [uv, x]], mask: [uv, y]], uv, a_flag_00_uv_mirror]]
    - var: [uv_base, ternary: [uv_invert_x: [uv, uv_00_invert_border_x], uv_base_0, a_flag_00_uv_invert]]
    - var: [uv_vector, uv_to_vector: [uv_base]]
    - var: [uv_length, length: [uv_vector]]
    - var: [uv_length_max, length: [float2: [1.0, 1.0]]]
    - var: [uv_offset, make_float2: [uv_00_offset_x, uv_00_offset_y]]
    # タイル情報 XXX セルとタイルは同義。命名規則を分けているだけ
    # 変形より先にタイリングを適用しないと3x3タイリングが成立しない点に注意
    - vars: [tile_uv_0, tile_index, cells, tiling_uv_for_ui: [add: [uv_base, uv_offset], aspect, uv_00_tiles, a_flag_00_uv_tiling_3x3, a_flag_00_uv_tiling_3x3_wrap, a_flag_00_uv_tiling_min_scroll]]
    - var: [tile_uv, ternary: [uv_fisheye: [tile_uv_0, 1.0], tile_uv_0, a_flag_00_uv_remap_fisheye]]
    # セル
    - var: [cell_unit_random, proxy_rand_fast: [tile_index, random_00_seed]]
    - var: [cell_unit_uv, div: [add: [tile_index, 0.5], cells]]
    - var: [cell_unit_vector, uv_to_vector: [cell_unit_uv]]
    - var: [cell_unit_length, length: [cell_unit_vector]]
    - var: [cell_aspect, ternary: [aspect, 1.0, a_flag_00_cell_aspect_keep]]
    - var: [cell_aspect2d, math_aspect2d: [aspect]]
    - var: [cell_offset, ternary: [mul: [mul: [cell_aspect2d, make_float2: [cell_00_offset_x, cell_00_offset_y]], pixel_size], make_float2: [cell_00_offset_x, cell_00_offset_y], a_flag_00_cell_offset_to_pixel]]
    # 1.0は半径なのでピクセル指定時は2倍にする
    - var: [cell_scale_padding_pixel_0, mul: [mul: [cell_00_scale_padding_pixel, 2.0], pixel_size]]
    # XXX 微小な補正(1ピクセル)の場合、DPIスケールによって1ピクセル前後に揺らぐとマスクの生成に大きく影響を与えるためDPIスケールの影響を除外できるようにする
    - var: [cell_scale_padding_pixel, ternary: [div: [cell_scale_padding_pixel_0, dpi_scale], cell_scale_padding_pixel_0, a_flag_00_cell_scale_padding_pixel_ignore_dpi_scale]]
    - var: [cell_scale, ternary: [add: [mul: [cell_aspect2d, cell_scale_padding_pixel], cell_00_scale], make_float2: [cell_00_scale, cell_00_scale], a_flag_00_cell_scale_padding_pixel]]
    - var: [cell_uv, uv_deformation: [tile_uv, cell_offset, cell_aspect, cell_scale]]
    # アニメ
    - var: [move, ternary: [add: [mul: [time: [], move_00_speed], move_00_alpha], move_00_alpha, a_flag_00_anime]]
    - var: [move_pos, mul: [make_float2: [move_00_speed_x, move_00_speed_y], move]]
    # テクスチャー
    - var: [texture_uv_offset, add: [make_float2: [texture_00_offset_x, texture_00_offset_y], move_pos]]
    - var: [texture_aspect, ternary: [aspect, 1.0, a_flag_00_cell_aspect_keep]]
    # テクスチャーのUV座標は単位変換が不要なため、uv_deformationのオフセット座標は使わず、単純に加算する
    - var: [texture_uv, add: [uv_deformation: [uv_base, float2: [0.0, 0.0], texture_aspect, make_float2: [texture_00_scale, texture_00_scale]], texture_uv_offset]]
    - var: [texture_color, sample: [texture_00_image, texture_uv]]
    # 強度(通常)
    - var: [intensity_uv, add: [uv_base, make_float2: [intensity_00_offset_x, intensity_00_offset_y]]]
    - var: [intensity_vector, uv_to_vector: [intensity_uv]]
    - var: [intensity_0, op_switch_dir_multiply: [mask: [intensity_uv, x], 1.0, a_flag_00_intensity_via_uv_x_01, a_flag_00_intensity_via_uv_x_10]]
    - var: [intensity_1, op_switch_dir_multiply: [mask: [intensity_uv, y], intensity_0, a_flag_00_intensity_via_uv_y_01, a_flag_00_intensity_via_uv_y_10]]
    - var: [intensity_2, op_switch_dir_multiply: [mul: [add: [mask: [intensity_uv, x], mask: [intensity_uv, y]], 0.5], intensity_1, a_flag_00_intensity_via_uv_xy_01, a_flag_00_intensity_via_uv_xy_10]]
    - var: [intensity_3, op_switch_dir_multiply: [div: [length: [intensity_vector], intensity_00_length_scale], intensity_2, a_flag_00_intensity_via_length_01, a_flag_00_intensity_via_length_10]]
    - var: [intensity_4, op_switch_dir_multiply: [mask: [cell_unit_uv, x], intensity_3, a_flag_00_intensity_via_cell_unit_uv_x_01, a_flag_00_intensity_via_cell_unit_uv_x_10]]
    - var: [intensity_5, op_switch_dir_multiply: [mask: [cell_unit_uv, y], intensity_4, a_flag_00_intensity_via_cell_unit_uv_y_01, a_flag_00_intensity_via_cell_unit_uv_y_10]]
    - var: [intensity_6, op_switch_dir_multiply: [div: [cell_unit_length, intensity_00_length_scale], intensity_5, a_flag_00_intensity_via_cell_unit_length_01, a_flag_00_intensity_via_cell_unit_length_10]]
    - var: [intensity_7, op_switch_dir_multiply: [mask: [cell_uv, x], intensity_6, a_flag_00_intensity_via_cell_uv_x_01, a_flag_00_intensity_via_cell_uv_x_10]]
    - var: [intensity_8, op_switch_dir_multiply: [mask: [cell_uv, y], intensity_7, a_flag_00_intensity_via_cell_uv_y_01, a_flag_00_intensity_via_cell_uv_y_10]]
    - var: [intensity_9, op_switch_dir_multiply: [div: [length: [uv_to_vector: [cell_uv]], intensity_00_length_scale], intensity_8, a_flag_00_intensity_via_cell_length_01, a_flag_00_intensity_via_cell_length_10]]
    - var: [intensity_10, op_switch_dir_multiply: [abs: [div: [proxy_atan2_fast: [mask: [intensity_vector, y], mask: [intensity_vector, x]], pi: []]], intensity_9, a_flag_00_intensity_via_uv_theta_01, a_flag_00_intensity_via_uv_theta_10]]
    - var: [intensity_11, op_switch_dir_multiply: [mask_square: [intensity_vector, 1.0], intensity_10, a_flag_00_intensity_via_uv_square_01, a_flag_00_intensity_via_uv_square_10]]
    - var: [intensity_12, op_switch_ab: [move, add: [intensity_11, move], intensity_11, a_flag_00_intensity_via_alpha, a_flag_00_intensity_via_alpha_add]]
    - var: [intensity_13, ternary: [mask: [sample: [intensity_00_curve, make_float2: [intensity_12, div: [add: [intensity_00_easing, 0.5], 256.0]], "LinearColor"], x], intensity_12, a_flag_00_intensity_curve]]
    - var: [intensity_14, op_switch_dir_multiply: [mask: [texture_color, x], intensity_13, a_flag_00_intensity_via_texture_01, a_flag_00_intensity_via_texture_10]]
    - var: [intensity_15, ternary: [mod: [add: [intensity_14, cell_unit_random], 1.0], intensity_14, a_flag_00_intensity_via_cell_unit_random]]
    - var: [intensity_16, ternary: [mod: [intensity_15, 1.0], intensity_15, a_flag_00_intensity_rotation]]
    - var: [intensity_17, ternary: [intensity_16, div: [sub: [intensity_16, intensity_00_min], sub: [intensity_00_max, intensity_00_min]], a_flag_00_intensity_stretch_alt]]
    - var: [intensity_18, ternary: [saturate: [intensity_17], intensity_17, a_flag_00_intensity_clamp]]
    - var: [intensity, ternary: [one_minus: [intensity_18], intensity_18, a_flag_00_intensity_invert]]
    # 強度(簡易)
    - var: [intensity_minimal_0, ternary: [mask: [intensity_uv, x], 1.0, a_flag_00_intensity_minimal_via_uv_x]]
    - var: [intensity_minimal_1, ternary: [mul: [intensity_minimal_0, mask: [intensity_uv, y]], intensity_minimal_0, a_flag_00_intensity_minimal_via_uv_y]]
    - var: [intensity_minimal_2, ternary: [mul: [mul: [intensity_minimal_1, add: [mask: [intensity_uv, x], mask: [intensity_uv, y]]], 0.5], intensity_minimal_1, a_flag_00_intensity_minimal_via_uv_xy]]
    - var: [intensity_minimal_3, ternary: [mul: [intensity_minimal_2, abs: [div: [proxy_atan2_fast: [mask: [intensity_vector, y], mask: [intensity_vector, x]], pi: []]]], intensity_minimal_2, a_flag_00_intensity_minimal_via_uv_theta]]
    - var: [intensity_minimal_4, ternary: [move, intensity_minimal_3, a_flag_00_intensity_minimal_via_alpha]]
    - var: [intensity_minimal_5, ternary: [saturate: [intensity_minimal_4], intensity_minimal_4, a_flag_00_intensity_minimal_clamp]]
    - var: [intensity_minimal, ternary: [one_minus: [intensity_minimal_5], intensity_minimal_5, a_flag_00_intensity_minimal_invert]]
    # XXX サイズを0にするとアーティファクトが発生するため下限値を設ける
    - var: [cell_scale_alt, mul: [cell_scale, max: [op_switch_dir_multiply: [intensity, 1.0, a_flag_00_cell_scale_with_intensity_01, a_flag_00_cell_scale_with_intensity_10], 0.001]]]
    # XXX マスク用のcell_uvにはintensityを適用するため別途算出
    - var: [cell_uv_alt_0, uv_deformation: [tile_uv, cell_offset, cell_aspect, cell_scale_alt]]
    - var: [cell_uv_alt, op_switch_2d: [cell_uv_alt_0, cell_uv_alt_0, cell_uv, a_flag_00_cell_scale_with_intensity_01, a_flag_00_cell_scale_with_intensity_10]]
    # ベクトル
    - var: [vector_u_theta, add: [add: [div: [cell_00_degree, 360.0], move], ternary: [cell_unit_random, 0.0, a_flag_00_cell_rotation_random]]]
    - var: [vector_aspect2d, math_aspect2d: [cell_00_aspect]]
    - var: [vector, ternary: [div: [matrix_rotation2d: [uv_to_vector: [cell_uv_alt], vector_u_theta], vector_aspect2d], div: [uv_to_vector: [cell_uv_alt], vector_aspect2d], a_flag_00_cell_rotation]]
    # サイズ
    - var: [mask_pixel_size, div: [pixel_size, min: [mask: [cell_scale_alt, x], mask: [cell_scale_alt, y]]]]
    # 角丸/中抜きの半径は(1.0=半径)。ピクセル指定時は2倍で直径に変換。タイリング時は半径がタイル数で分割されるため、更にタイル数を掛けて直径に変換
    - var: [mask_radius_bias_for_line, ternary: [mul: [mask_pixel_size, mul: [2.0, uv_00_tiles]], 1.0, a_flag_00_size_to_pixel_for_line]]
    - var: [mask_radius_bias_for_mask, ternary: [mul: [mask_pixel_size, mul: [2.0, uv_00_tiles]], 1.0, a_flag_00_size_to_pixel_for_mask]]
    # カプセルは半径によって1の長さが決定するため、ピクセル指定時は線のサイズに逆数を掛ける
    - var: [mask_hollow_line_size_0, mul: [hollow_00_line_size, op_or: [div: [1.0, cupsule_00_radius], 1.0, a_flag_00_mask_clock, a_flag_00_mask_cupsule]]]
    - var: [mask_hollow_line_size, op_switch_dir_multiply: [intensity, mask_hollow_line_size_0, a_flag_00_hollow_size_with_intensity_01, a_flag_00_hollow_size_with_intensity_10]]
    # 消失エフェクト
    - var: [dissolve_alpha, ternary: [div: [mul: [move, uv_length_max], uv_length], move, a_flag_00_dissolve_unit]]
    - vars: [dissolve_mask, dissolve_min_mask, dissolve_min_alpha, mask_dissolve: [one_minus: [dissolve_alpha], dissolve_00_smooth, make_float2: [dissolve_00_scroll_x, dissolve_00_scroll_y]]]
    # マスク
    - var: [mask_0, ternary: [mask: [cell_uv_alt, x], 1.0, a_flag_00_mask_cell_x]]
    - var: [mask_1, ternary: [length: [vector], mask_0, a_flag_00_mask_circle]]
    - var: [mask_2, ternary: [mask_polygon: [vector, polygon_00_sides], mask_1, a_flag_00_mask_polygon]]
    - var: [mask_3, ternary: [mask_polygon_round: [vector, polygon_00_sides, mul: [polygon_00_round_radius, mask_radius_bias_for_mask]], mask_2, a_flag_00_mask_polygon_round]]
    - var: [mask_4, ternary: [mask_square: [vector, 1.0], mask_3, a_flag_00_mask_square]]
    - var: [mask_5, ternary: [mask_square_round: [vector, 1.0, mul: [polygon_00_round_radius, mask_radius_bias_for_mask], mul: [polygon_00_round_radius_min, mask_radius_bias_for_mask], polygon_00_allows_edges], mask_4, a_flag_00_mask_square_round]]
    - var: [mask_6, ternary: [mask_square_round_fix: [cell_uv_alt, aspect, mul: [polygon_00_round_radius, mask_radius_bias_for_mask], mul: [polygon_00_round_radius_min, mask_radius_bias_for_mask], polygon_00_allows_edges], mask_5, a_flag_00_mask_square_round_fix]]
    - var: [mask_7, ternary: [mask_cupsule: [vector, cupsule_00_radius, cupsule_00_begin, cupsule_00_end], mask_6, a_flag_00_mask_cupsule]]
    - var: [mask_8, ternary: [mask_clock_cupsule: [vector, cupsule_00_radius, move, cupsule_00_center], mask_7, a_flag_00_mask_clock]]
    - var: [mask_9, ternary: [mask_stripe: [intensity, mul: [stripe_00_size, mask_radius_bias_for_mask]], mask_8, a_flag_00_mask_stripe]]
    - var: [mask_10, ternary: [mask_flash: [add: [mask: [cell_uv_alt, x], mask: [cell_uv_alt, y]], flash_00_speed, flash_00_interval, flash_00_size, move], mask_9, a_flag_00_mask_flash]]
    - var: [mask_11, ternary: [mask_aurora: [cell_uv_alt, move, 2.0, 8.0, true], mask_10, a_flag_00_mask_aurora]]
    - var: [mask_12, ternary: [dissolve_mask, mask_11, a_flag_00_mask_dissolve]]
    - var: [mask, ternary: [mask_linear_range: [mask_12, 1.0, mul: [mask_hollow_line_size, mask_radius_bias_for_line], hollow_00_center], mask_12, a_flag_00_mask_hollow]]
    # 強度(通常2)
    - var: [intensity_alt_0, op_switch_dir_multiply: [saturate: [mask], intensity, a_flag_00_intensity_via_shape_01_alt, a_flag_00_intensity_via_shape_10_alt]]
    - var: [intensity_alt_1, op_switch_dir_multiply: [dissolve_min_alpha, intensity_alt_0, a_flag_00_intensity_via_dissolve_01_alt, a_flag_00_intensity_via_dissolve_10_alt]]
    - var: [intensity_alt_2, ternary: [mask: [sample: [intensity_00_curve, make_float2: [intensity_alt_1, div: [add: [intensity_00_easing, 0.5], 256.0]], "LinearColor"], x], intensity_alt_1, a_flag_00_intensity_curve_alt]]
    - var: [intensity_alt, ternary: [saturate: [div: [sub: [intensity_alt_2, intensity_00_min], sub: [intensity_00_max, intensity_00_min]]], intensity_alt_2, a_flag_00_intensity_stretch_alt]]
    # 強度(ベースカラー/輪郭線)
    - var: [intensity_color, ternary: [intensity_minimal, intensity_alt, a_flag_00_color_intensity_via_minimal]]
    - var: [intensity_line, ternary: [intensity_minimal, intensity_alt, a_flag_00_color_intensity_via_minimal_for_line]]
    # 輪郭線
    # レイヤー単体で形状と輪郭線を合成するため別途マスクを生成 XXX powerは2.0 ~ 4.0程度が適当。小さいほど均し範囲が広くなるため太く見え、大きいと細く見えるがジャギが出る
    - var: [line_mask, mask_linear_range: [mask, 1.0, mul: [mask_hollow_line_size, mask_radius_bias_for_line], hollow_00_center]]
    - var: [line_alpha, one_minus: [power: [saturate: [line_mask], 2.5]]]
    # ベースカラー
    - var: [color_0, ternary: [color_gradation: [color_00, color_00_b, intensity_color], color_00, a_flag_00_color_gradation]]
    - var: [color_1, ternary: [color_gradation3: [color_00, color_00_b, color_00_c, intensity_color], color_0, a_flag_00_color_gradation3]]
    - var: [color_2, ternary: [color_gradation_ab_to_c: [color_00, color_00_b, color_00_c, intensity_color, saturate: [move]], color_1, a_flag_00_color_gradation_ab_to_c]]
    - var: [color_3, ternary: [color_gradation_c_to_ab: [color_00, color_00_b, color_00_c, intensity_color, saturate: [move]], color_2, a_flag_00_color_gradation_c_to_ab]]
    - var: [color_4, ternary: [color_spectrum: [intensity_color], color_3, a_flag_00_color_spectrum]]
    - var: [color_5, ternary: [color_gradation: [color_4, mask: [texture_color, xyz], mul: [texture_00_alpha, intensity_color]], color_4, a_flag_00_color_texture]]
    - var: [color_6, ternary: [color_gradation: [color_5, color_00_line, line_alpha], color_5, a_flag_00_color_line]]
    - var: [color_7, ternary: [color_gradation_c_to_ab: [color_00_line, color_00_line_b, color_6, intensity_line, line_alpha], color_6, a_flag_00_color_line_gradation]]
    - var: [color_8, ternary: [color_gradation_line_ab_to_c: [color_00_line, color_00_line_b, color_00_line_c, color_7, intensity_line, saturate: [move], line_alpha], color_7, a_flag_00_color_line_gradation_ab_to_c]]
    - var: [color, ternary: [color_rotation: [color_8, move], color_8, a_flag_00_color_rotaion]]
    # 透過率
    - var: [opacity_0, ternary: [mul: [opacity_00, op_in: [cell_unit_length, clip_00_length_min, clip_00_length_max]], opacity_00, a_flag_00_clip_length]]
    - var: [opacity_1, ternary: [mul: [opacity_0, op_le: [cell_unit_random, clip_00_random]], opacity_0, a_flag_00_clip_random]]
    - var: [opacity_2, ternary: [mul: [opacity_1, mask_rect: [cell_unit_vector, make_float2: [clip_00_rect_x, clip_00_rect_y], make_float2: [clip_00_rect_center_x, clip_00_rect_center_y]]], opacity_1, a_flag_00_clip_rect]]
    - var: [opacity_3, ternary: [mul: [opacity_2, mask_rect_edge: [cell_unit_vector, make_float2: [clip_00_rect_x, clip_00_rect_y], make_float2: [clip_00_rect_center_x, clip_00_rect_center_y]]], opacity_2, a_flag_00_clip_rect_edge]]
    - var: [opacity_4, ternary: [mul: [opacity_3, mask_square_side: [vector, mul: [mask_hollow_line_size, mask_radius_bias_for_line], polygon_00_allows_sides]], opacity_3, a_flag_00_clip_square_sides]]
    - var: [opacity_5, ternary: [mul: [opacity_4, mask: [texture_color, w]], opacity_4, a_flag_00_color_trans_with_texture]]
    - var: [opacity, ternary: [mul: [opacity_5, intensity_alt], opacity_5, a_flag_00_color_trans]]
    - returns: [color, color, 'ベースカラー']
    - returns: [opacity, opacity, '透過率']
    - returns: [mask, mask, '強度']
ui_layer_b1:
  name: ui_layer_b1
  desc: 'UI用レイヤー'
  params:
    - var: [uv, param: [float2, uv, tex_coord: [0], 'UV座標']]
    - var: [resolution, param: [float2, resolution, float2: [250.0, 250.0], '解像度 (default = 250:250)']]
    - var: [dpi_scale, param: [float, dpi_scale, 0.6666, 'DPIスケール (default = 0.666)']]
  statements:
    - exports_b1: []
    # 解像度
    - var: [aspect, math_resolution_to_aspect: [resolution]]
    - var: [pixel_size, math_resolution_to_pixel_size: [resolution]]
    # UV座標
    - var: [uv_base_0, ternary: [make_float2: [one_minus: [mask: [uv, x]], mask: [uv, y]], uv, a_flag_b1_uv_mirror]]
    - var: [uv_base, ternary: [uv_invert_x: [uv, uv_b1_invert_border_x], uv_base_0, a_flag_b1_uv_invert]]
    - var: [uv_vector, uv_to_vector: [uv_base]]
    - var: [uv_length, length: [uv_vector]]
    - var: [uv_length_max, length: [float2: [1.0, 1.0]]]
    - var: [uv_offset, make_float2: [uv_b1_offset_x, uv_b1_offset_y]]
    # タイル情報 XXX セルとタイルは同義。命名規則を分けているだけ
    # 変形より先にタイリングを適用しないと3x3タイリングが成立しない点に注意
    - vars: [tile_uv_0, tile_index, cells, tiling_uv_for_ui: [add: [uv_base, uv_offset], aspect, uv_b1_tiles, a_flag_b1_uv_tiling_3x3, a_flag_b1_uv_tiling_3x3_wrap, a_flag_b1_uv_tiling_min_scroll]]
    - var: [tile_uv, ternary: [uv_fisheye: [tile_uv_0, 1.0], tile_uv_0, a_flag_b1_uv_remap_fisheye]]
    # セル
    - var: [cell_unit_random, proxy_rand_fast: [tile_index, random_b1_seed]]
    - var: [cell_unit_uv, div: [add: [tile_index, 0.5], cells]]
    - var: [cell_unit_vector, uv_to_vector: [cell_unit_uv]]
    - var: [cell_unit_length, length: [cell_unit_vector]]
    - var: [cell_aspect, ternary: [aspect, 1.0, a_flag_b1_cell_aspect_keep]]
    - var: [cell_aspect2d, math_aspect2d: [aspect]]
    - var: [cell_offset, ternary: [mul: [mul: [cell_aspect2d, make_float2: [cell_b1_offset_x, cell_b1_offset_y]], pixel_size], make_float2: [cell_b1_offset_x, cell_b1_offset_y], a_flag_b1_cell_offset_to_pixel]]
    # 1.0は半径なのでピクセル指定時は2倍にする
    - var: [cell_scale_padding_pixel_0, mul: [mul: [cell_b1_scale_padding_pixel, 2.0], pixel_size]]
    # XXX 微小な補正(1ピクセル)の場合、DPIスケールによって1ピクセル前後に揺らぐとマスクの生成に大きく影響を与えるためDPIスケールの影響を除外できるようにする
    - var: [cell_scale_padding_pixel, ternary: [div: [cell_scale_padding_pixel_0, dpi_scale], cell_scale_padding_pixel_0, a_flag_b1_cell_scale_padding_pixel_ignore_dpi_scale]]
    - var: [cell_scale, ternary: [add: [mul: [cell_aspect2d, cell_scale_padding_pixel], cell_b1_scale], make_float2: [cell_b1_scale, cell_b1_scale], a_flag_b1_cell_scale_padding_pixel]]
    - var: [cell_uv, uv_deformation: [tile_uv, cell_offset, cell_aspect, cell_scale]]
    # アニメ
    - var: [move, ternary: [add: [mul: [time: [], move_b1_speed], move_b1_alpha], move_b1_alpha, a_flag_b1_anime]]
    - var: [move_pos, mul: [make_float2: [move_b1_speed_x, move_b1_speed_y], move]]
    # テクスチャー
    - var: [texture_uv_offset, add: [make_float2: [texture_b1_offset_x, texture_b1_offset_y], move_pos]]
    - var: [texture_aspect, ternary: [aspect, 1.0, a_flag_b1_cell_aspect_keep]]
    # テクスチャーのUV座標は単位変換が不要なため、uv_deformationのオフセット座標は使わず、単純に加算する
    - var: [texture_uv, add: [uv_deformation: [uv_base, float2: [0.0, 0.0], texture_aspect, make_float2: [texture_b1_scale, texture_b1_scale]], texture_uv_offset]]
    - var: [texture_color, sample: [texture_b1_image, texture_uv]]
    # 強度(通常)
    - var: [intensity_uv, add: [uv_base, make_float2: [intensity_b1_offset_x, intensity_b1_offset_y]]]
    - var: [intensity_vector, uv_to_vector: [intensity_uv]]
    - var: [intensity_0, op_switch_dir_multiply: [mask: [intensity_uv, x], 1.0, a_flag_b1_intensity_via_uv_x_01, a_flag_b1_intensity_via_uv_x_10]]
    - var: [intensity_1, op_switch_dir_multiply: [mask: [intensity_uv, y], intensity_0, a_flag_b1_intensity_via_uv_y_01, a_flag_b1_intensity_via_uv_y_10]]
    - var: [intensity_2, op_switch_dir_multiply: [mul: [add: [mask: [intensity_uv, x], mask: [intensity_uv, y]], 0.5], intensity_1, a_flag_b1_intensity_via_uv_xy_01, a_flag_b1_intensity_via_uv_xy_10]]
    - var: [intensity_3, op_switch_dir_multiply: [div: [length: [intensity_vector], intensity_b1_length_scale], intensity_2, a_flag_b1_intensity_via_length_01, a_flag_b1_intensity_via_length_10]]
    - var: [intensity_4, op_switch_dir_multiply: [mask: [cell_unit_uv, x], intensity_3, a_flag_b1_intensity_via_cell_unit_uv_x_01, a_flag_b1_intensity_via_cell_unit_uv_x_10]]
    - var: [intensity_5, op_switch_dir_multiply: [mask: [cell_unit_uv, y], intensity_4, a_flag_b1_intensity_via_cell_unit_uv_y_01, a_flag_b1_intensity_via_cell_unit_uv_y_10]]
    - var: [intensity_6, op_switch_dir_multiply: [div: [cell_unit_length, intensity_b1_length_scale], intensity_5, a_flag_b1_intensity_via_cell_unit_length_01, a_flag_b1_intensity_via_cell_unit_length_10]]
    - var: [intensity_7, op_switch_dir_multiply: [mask: [cell_uv, x], intensity_6, a_flag_b1_intensity_via_cell_uv_x_01, a_flag_b1_intensity_via_cell_uv_x_10]]
    - var: [intensity_8, op_switch_dir_multiply: [mask: [cell_uv, y], intensity_7, a_flag_b1_intensity_via_cell_uv_y_01, a_flag_b1_intensity_via_cell_uv_y_10]]
    - var: [intensity_9, op_switch_dir_multiply: [div: [length: [uv_to_vector: [cell_uv]], intensity_b1_length_scale], intensity_8, a_flag_b1_intensity_via_cell_length_01, a_flag_b1_intensity_via_cell_length_10]]
    - var: [intensity_10, op_switch_dir_multiply: [abs: [div: [proxy_atan2_fast: [mask: [intensity_vector, y], mask: [intensity_vector, x]], pi: []]], intensity_9, a_flag_b1_intensity_via_uv_theta_01, a_flag_b1_intensity_via_uv_theta_10]]
    - var: [intensity_11, op_switch_dir_multiply: [mask_square: [intensity_vector, 1.0], intensity_10, a_flag_b1_intensity_via_uv_square_01, a_flag_b1_intensity_via_uv_square_10]]
    - var: [intensity_12, op_switch_ab: [move, add: [intensity_11, move], intensity_11, a_flag_b1_intensity_via_alpha, a_flag_b1_intensity_via_alpha_add]]
    - var: [intensity_13, ternary: [mask: [sample: [intensity_b1_curve, make_float2: [intensity_12, div: [add: [intensity_b1_easing, 0.5], 256.0]], "LinearColor"], x], intensity_12, a_flag_b1_intensity_curve]]
    - var: [intensity_14, op_switch_dir_multiply: [mask: [texture_color, x], intensity_13, a_flag_b1_intensity_via_texture_01, a_flag_b1_intensity_via_texture_10]]
    - var: [intensity_15, ternary: [mod: [add: [intensity_14, cell_unit_random], 1.0], intensity_14, a_flag_b1_intensity_via_cell_unit_random]]
    - var: [intensity_16, ternary: [mod: [intensity_15, 1.0], intensity_15, a_flag_b1_intensity_rotation]]
    - var: [intensity_17, ternary: [intensity_16, div: [sub: [intensity_16, intensity_b1_min], sub: [intensity_b1_max, intensity_b1_min]], a_flag_b1_intensity_stretch_alt]]
    - var: [intensity_18, ternary: [saturate: [intensity_17], intensity_17, a_flag_b1_intensity_clamp]]
    - var: [intensity, ternary: [one_minus: [intensity_18], intensity_18, a_flag_b1_intensity_invert]]
    # 強度(簡易)
    - var: [intensity_minimal_0, ternary: [mask: [intensity_uv, x], 1.0, a_flag_b1_intensity_minimal_via_uv_x]]
    - var: [intensity_minimal_1, ternary: [mul: [intensity_minimal_0, mask: [intensity_uv, y]], intensity_minimal_0, a_flag_b1_intensity_minimal_via_uv_y]]
    - var: [intensity_minimal_2, ternary: [mul: [mul: [intensity_minimal_1, add: [mask: [intensity_uv, x], mask: [intensity_uv, y]]], 0.5], intensity_minimal_1, a_flag_b1_intensity_minimal_via_uv_xy]]
    - var: [intensity_minimal_3, ternary: [mul: [intensity_minimal_2, abs: [div: [proxy_atan2_fast: [mask: [intensity_vector, y], mask: [intensity_vector, x]], pi: []]]], intensity_minimal_2, a_flag_b1_intensity_minimal_via_uv_theta]]
    - var: [intensity_minimal_4, ternary: [move, intensity_minimal_3, a_flag_b1_intensity_minimal_via_alpha]]
    - var: [intensity_minimal_5, ternary: [saturate: [intensity_minimal_4], intensity_minimal_4, a_flag_b1_intensity_minimal_clamp]]
    - var: [intensity_minimal, ternary: [one_minus: [intensity_minimal_5], intensity_minimal_5, a_flag_b1_intensity_minimal_invert]]
    # XXX サイズを0にするとアーティファクトが発生するため下限値を設ける
    - var: [cell_scale_alt, mul: [cell_scale, max: [op_switch_dir_multiply: [intensity, 1.0, a_flag_b1_cell_scale_with_intensity_01, a_flag_b1_cell_scale_with_intensity_10], 0.001]]]
    # XXX マスク用のcell_uvにはintensityを適用するため別途算出
    - var: [cell_uv_alt_0, uv_deformation: [tile_uv, cell_offset, cell_aspect, cell_scale_alt]]
    - var: [cell_uv_alt, op_switch_2d: [cell_uv_alt_0, cell_uv_alt_0, cell_uv, a_flag_b1_cell_scale_with_intensity_01, a_flag_b1_cell_scale_with_intensity_10]]
    # ベクトル
    - var: [vector_u_theta, add: [add: [div: [cell_b1_degree, 360.0], move], ternary: [cell_unit_random, 0.0, a_flag_b1_cell_rotation_random]]]
    - var: [vector_aspect2d, math_aspect2d: [cell_b1_aspect]]
    - var: [vector, ternary: [div: [matrix_rotation2d: [uv_to_vector: [cell_uv_alt], vector_u_theta], vector_aspect2d], div: [uv_to_vector: [cell_uv_alt], vector_aspect2d], a_flag_b1_cell_rotation]]
    # サイズ
    - var: [mask_pixel_size, div: [pixel_size, min: [mask: [cell_scale_alt, x], mask: [cell_scale_alt, y]]]]
    # 角丸/中抜きの半径は(1.0=半径)。ピクセル指定時は2倍で直径に変換。タイリング時は半径がタイル数で分割されるため、更にタイル数を掛けて直径に変換
    - var: [mask_radius_bias_for_line, ternary: [mul: [mask_pixel_size, mul: [2.0, uv_b1_tiles]], 1.0, a_flag_b1_size_to_pixel_for_line]]
    - var: [mask_radius_bias_for_mask, ternary: [mul: [mask_pixel_size, mul: [2.0, uv_b1_tiles]], 1.0, a_flag_b1_size_to_pixel_for_mask]]
    # カプセルは半径によって1の長さが決定するため、ピクセル指定時は線のサイズに逆数を掛ける
    - var: [mask_hollow_line_size_0, mul: [hollow_b1_line_size, op_or: [div: [1.0, cupsule_b1_radius], 1.0, a_flag_b1_mask_clock, a_flag_b1_mask_cupsule]]]
    - var: [mask_hollow_line_size, op_switch_dir_multiply: [intensity, mask_hollow_line_size_0, a_flag_b1_hollow_size_with_intensity_01, a_flag_b1_hollow_size_with_intensity_10]]
    # 消失エフェクト
    - var: [dissolve_alpha, ternary: [div: [mul: [move, uv_length_max], uv_length], move, a_flag_b1_dissolve_unit]]
    - vars: [dissolve_mask, dissolve_min_mask, dissolve_min_alpha, mask_dissolve: [one_minus: [dissolve_alpha], dissolve_b1_smooth, make_float2: [dissolve_b1_scroll_x, dissolve_b1_scroll_y]]]
    # マスク
    - var: [mask_0, ternary: [mask: [cell_uv_alt, x], 1.0, a_flag_b1_mask_cell_x]]
    - var: [mask_1, ternary: [length: [vector], mask_0, a_flag_b1_mask_circle]]
    - var: [mask_2, ternary: [mask_polygon: [vector, polygon_b1_sides], mask_1, a_flag_b1_mask_polygon]]
    - var: [mask_3, ternary: [mask_polygon_round: [vector, polygon_b1_sides, mul: [polygon_b1_round_radius, mask_radius_bias_for_mask]], mask_2, a_flag_b1_mask_polygon_round]]
    - var: [mask_4, ternary: [mask_square: [vector, 1.0], mask_3, a_flag_b1_mask_square]]
    - var: [mask_5, ternary: [mask_square_round: [vector, 1.0, mul: [polygon_b1_round_radius, mask_radius_bias_for_mask], mul: [polygon_b1_round_radius_min, mask_radius_bias_for_mask], polygon_b1_allows_edges], mask_4, a_flag_b1_mask_square_round]]
    - var: [mask_6, ternary: [mask_square_round_fix: [cell_uv_alt, aspect, mul: [polygon_b1_round_radius, mask_radius_bias_for_mask], mul: [polygon_b1_round_radius_min, mask_radius_bias_for_mask], polygon_b1_allows_edges], mask_5, a_flag_b1_mask_square_round_fix]]
    - var: [mask_7, ternary: [mask_cupsule: [vector, cupsule_b1_radius, cupsule_b1_begin, cupsule_b1_end], mask_6, a_flag_b1_mask_cupsule]]
    - var: [mask_8, ternary: [mask_clock_cupsule: [vector, cupsule_b1_radius, move, cupsule_b1_center], mask_7, a_flag_b1_mask_clock]]
    - var: [mask_9, ternary: [mask_stripe: [intensity, mul: [stripe_b1_size, mask_radius_bias_for_mask]], mask_8, a_flag_b1_mask_stripe]]
    - var: [mask_10, ternary: [mask_flash: [add: [mask: [cell_uv_alt, x], mask: [cell_uv_alt, y]], flash_b1_speed, flash_b1_interval, flash_b1_size, move], mask_9, a_flag_b1_mask_flash]]
    - var: [mask_11, ternary: [mask_aurora: [cell_uv_alt, move, 2.0, 8.0, true], mask_10, a_flag_b1_mask_aurora]]
    - var: [mask_12, ternary: [dissolve_mask, mask_11, a_flag_b1_mask_dissolve]]
    - var: [mask, ternary: [mask_linear_range: [mask_12, 1.0, mul: [mask_hollow_line_size, mask_radius_bias_for_line], hollow_b1_center], mask_12, a_flag_b1_mask_hollow]]
    # 強度(通常2)
    - var: [intensity_alt_0, op_switch_dir_multiply: [saturate: [mask], intensity, a_flag_b1_intensity_via_shape_01_alt, a_flag_b1_intensity_via_shape_10_alt]]
    - var: [intensity_alt_1, op_switch_dir_multiply: [dissolve_min_alpha, intensity_alt_0, a_flag_b1_intensity_via_dissolve_01_alt, a_flag_b1_intensity_via_dissolve_10_alt]]
    - var: [intensity_alt_2, ternary: [mask: [sample: [intensity_b1_curve, make_float2: [intensity_alt_1, div: [add: [intensity_b1_easing, 0.5], 256.0]], "LinearColor"], x], intensity_alt_1, a_flag_b1_intensity_curve_alt]]
    - var: [intensity_alt, ternary: [saturate: [div: [sub: [intensity_alt_2, intensity_b1_min], sub: [intensity_b1_max, intensity_b1_min]]], intensity_alt_2, a_flag_b1_intensity_stretch_alt]]
    # 強度(ベースカラー/輪郭線)
    - var: [intensity_color, ternary: [intensity_minimal, intensity_alt, a_flag_b1_color_intensity_via_minimal]]
    - var: [intensity_line, ternary: [intensity_minimal, intensity_alt, a_flag_b1_color_intensity_via_minimal_for_line]]
    # 輪郭線
    # レイヤー単体で形状と輪郭線を合成するため別途マスクを生成 XXX powerは2.0 ~ 4.0程度が適当。小さいほど均し範囲が広くなるため太く見え、大きいと細く見えるがジャギが出る
    - var: [line_mask, mask_linear_range: [mask, 1.0, mul: [mask_hollow_line_size, mask_radius_bias_for_line], hollow_b1_center]]
    - var: [line_alpha, one_minus: [power: [saturate: [line_mask], 2.5]]]
    # ベースカラー
    - var: [color_0, ternary: [color_gradation: [color_b1, color_b1_b, intensity_color], color_b1, a_flag_b1_color_gradation]]
    - var: [color_1, ternary: [color_gradation3: [color_b1, color_b1_b, color_b1_c, intensity_color], color_0, a_flag_b1_color_gradation3]]
    - var: [color_2, ternary: [color_gradation_ab_to_c: [color_b1, color_b1_b, color_b1_c, intensity_color, saturate: [move]], color_1, a_flag_b1_color_gradation_ab_to_c]]
    - var: [color_3, ternary: [color_gradation_c_to_ab: [color_b1, color_b1_b, color_b1_c, intensity_color, saturate: [move]], color_2, a_flag_b1_color_gradation_c_to_ab]]
    - var: [color_4, ternary: [color_spectrum: [intensity_color], color_3, a_flag_b1_color_spectrum]]
    - var: [color_5, ternary: [color_gradation: [color_4, mask: [texture_color, xyz], mul: [texture_b1_alpha, intensity_color]], color_4, a_flag_b1_color_texture]]
    - var: [color_6, ternary: [color_gradation: [color_5, color_b1_line, line_alpha], color_5, a_flag_b1_color_line]]
    - var: [color_7, ternary: [color_gradation_c_to_ab: [color_b1_line, color_b1_line_b, color_6, intensity_line, line_alpha], color_6, a_flag_b1_color_line_gradation]]
    - var: [color_8, ternary: [color_gradation_line_ab_to_c: [color_b1_line, color_b1_line_b, color_b1_line_c, color_7, intensity_line, saturate: [move], line_alpha], color_7, a_flag_b1_color_line_gradation_ab_to_c]]
    - var: [color, ternary: [color_rotation: [color_8, move], color_8, a_flag_b1_color_rotaion]]
    # 透過率
    - var: [opacity_0, ternary: [mul: [opacity_b1, op_in: [cell_unit_length, clip_b1_length_min, clip_b1_length_max]], opacity_b1, a_flag_b1_clip_length]]
    - var: [opacity_1, ternary: [mul: [opacity_0, op_le: [cell_unit_random, clip_b1_random]], opacity_0, a_flag_b1_clip_random]]
    - var: [opacity_2, ternary: [mul: [opacity_1, mask_rect: [cell_unit_vector, make_float2: [clip_b1_rect_x, clip_b1_rect_y], make_float2: [clip_b1_rect_center_x, clip_b1_rect_center_y]]], opacity_1, a_flag_b1_clip_rect]]
    - var: [opacity_3, ternary: [mul: [opacity_2, mask_rect_edge: [cell_unit_vector, make_float2: [clip_b1_rect_x, clip_b1_rect_y], make_float2: [clip_b1_rect_center_x, clip_b1_rect_center_y]]], opacity_2, a_flag_b1_clip_rect_edge]]
    - var: [opacity_4, ternary: [mul: [opacity_3, mask_square_side: [vector, mul: [mask_hollow_line_size, mask_radius_bias_for_line], polygon_b1_allows_sides]], opacity_3, a_flag_b1_clip_square_sides]]
    - var: [opacity_5, ternary: [mul: [opacity_4, mask: [texture_color, w]], opacity_4, a_flag_b1_color_trans_with_texture]]
    - var: [opacity, ternary: [mul: [opacity_5, intensity_alt], opacity_5, a_flag_b1_color_trans]]
    - returns: [color, color, 'ベースカラー']
    - returns: [opacity, opacity, '透過率']
    - returns: [mask, mask, '強度']
# function ui_layer_00
# function ui_layer_b1
